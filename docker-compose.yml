version: '3.8'

services:
  h2fpef-score-heart-failure:
    build: .
    container_name: h2fpef-score-heart-failure
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=h2fpef-score-heart-failure-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
