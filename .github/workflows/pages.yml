name: Deploy browser calculator to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed HTML and scoring modules
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          SITE_URL="${SITE_URL%/}/"
          curl --fail --show-error --silent --location --retry 10 --retry-all-errors --retry-delay 5 "${SITE_URL}" -o /tmp/h2fpef-page.html
          grep -q "H₂FPEF score" /tmp/h2fpef-page.html
          curl --fail --show-error --silent --location --retry 10 --retry-all-errors --retry-delay 5 "${SITE_URL}app.mjs" -o /tmp/h2fpef-app.mjs
          curl --fail --show-error --silent --location --retry 10 --retry-all-errors --retry-delay 5 "${SITE_URL}score.mjs" -o /tmp/h2fpef-score.mjs
          grep -q "scoreH2fpef" /tmp/h2fpef-score.mjs
